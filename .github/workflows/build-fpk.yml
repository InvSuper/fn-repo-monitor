name: Build fn-repo-monitor FPK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fnpack
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help || true

      - name: Ensure scripts executable
        run: |
          chmod +x apps/fn-repo-monitor/cmd/*
          chmod +x apps/fn-repo-monitor/app/src/monitor.py
          chmod +x apps/fn-repo-monitor/app/src/server.py
          chmod +x apps/fn-repo-monitor/app/ui/index.cgi

      - name: Build FPK
        run: |
          cd apps/fn-repo-monitor
          rm -f *.fpk
          # fnpack 打包失败时也会返回 0，必须显式校验产物
          fnpack build > /tmp/fnpack-build.log 2>&1 || true
          echo "===== fnpack 输出 ====="
          cat /tmp/fnpack-build.log
          echo "======================="
          if [ ! -f fn-repo-monitor.fpk ]; then
            echo "::error::fnpack 未生成 fn-repo-monitor.fpk，打包失败（详见上方日志）"
            exit 1
          fi
          ls -lh fn-repo-monitor.fpk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fn-repo-monitor-fpk
          path: apps/fn-repo-monitor/*.fpk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/fn-repo-monitor/*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
